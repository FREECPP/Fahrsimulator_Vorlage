<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fahrsimulator</title>
        <link rel="stylesheet" href="static/css/index.css">
        <script defer src="static/js/index.js"></script>
    </head>
    
    <body class="body">
    
        <header class="header">
            <div>
                <img src="/static/logo_white_mini.png" id="logo" alt="Logo">
            </div>
            <div>
                <h1 style="margin: 0;">Fahrsimulator</h1>
            </div>
        </header>
    
        <div class="box">
            
            <div class="container">
            <h1>Verzeichnisverwaltung</h1>
            
                <!-- Bestehendes Verzeichnis auswählen -->
                <div class="section">
                    <h2>Bestehendes Verzeichnis auswählen</h2>
                    <form id="selectForm">
                        <label for="existierendesVerzeichnis">Projektverzeichnis:</label>
                        <select id="existierendesVerzeichnis" name="existierendesVerzeichnis" required>
                            <option value="">-- Wähle ein Verzeichnis --</option>
                            {% for dir in directories %}
                            <option value="{{ dir }}">{{ dir }}</option>
                            {% endfor %}
                        </select>
                        <label for="projektname">Projektname:</label>
                        <input type="text"
                               id="projektname"
                               name="projektname"
                               required
                               minlength="4"
                               pattern="[A-Za-z0-9_\-]{4,}"
                               title="Mindestens 4 Zeichen, nur Buchstaben, Zahlen, _ und -">
                        <button type="submit">Auswählen</button>
                    </form>
                    <div id="selectMessage"></div>
                </div>
        
                <!-- Neues Verzeichnis anlegen -->
                <div class="section">
                    <h2>Neues Verzeichnis anlegen</h2>
                    <form id="createForm">
                        <label for="projektverzeichnis">Projektbezeichnung:</label>
                        <input type="text" 
                               id="projektverzeichnis" 
                               name="projektverzeichnis" 
                               required 
                               minlength="4"
                               pattern="[A-Za-z0-9_\-]{4,}"
                               title="Mindestens 4 Zeichen, nur Buchstaben, Zahlen, _ und -">
                        <button type="submit">Anlegen</button>
                    </form>
                    <div id="createMessage"></div>
                </div>
            </div>
                
            
        </div>

    
        <footer class="footer">
            <h1>Footer mit Links zur Doku</h1>
        </footer>
    
    </body>

</html>
