<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fahrsimulator</title>
    </head>
    
    <body class="body">
    
        <header class="header">
            <div>
                <img src="/static/logo_white_mini.png" id="logo" alt="Logo">
            </div>
            <div>
                <h1 style="margin: 0;">Fahrsimulator</h1>
            </div>
        </header>
    
        <div class="button_box">
                <table>
                    <tr>
                        <td>
                            <form action="start_logging" method="POST">
                                <label for="fname">First name:</label>
                                <input type="text" id="fname" name="fname">
                                    <br><br>
                                <label for="lname">Last name:</label>
                                <input type="text" id="lname" name="lname">
                                <br><br>
                                <button class="button" type="submit" value="Submit">Start</button>
                            </form>

                        </td>
                    </tr>
                    <tr>                        
                        <td>
                            <form action="stop_logging" method="POST">
                                <button class="button" type="submit" value="Submit">Stop</button>
                            </form>    
                        </td>
                    </tr>
                </table>
        </div>
        
        <div class="box">
            <table>
                <tr>
                    <td>
                        <div class="box">
                            <h4 style="margin-bottom: 10px;">Vorschau</h4>
                            <img src="{{ url_for('video_feed') }}" width="640">
                        </div>
                    </td>
                    <td>
                        <div>
                            <h4>Geschwindigkeit über Zeit</h4>
                            <canvas id="speedCanvas" width="640" height="480"></canvas>
                            <button onclick="updatePlot()">Update</button>
                        </div>
                    </td>
                </tr>
            </table>
        </div>

        
        
 

    
        <footer class="footer">
            <h1>Footer</h1>
        </footer>
    
    </body>

</html>

        outline: 0;
    }
    
    
    
</style>


        
<script>
    const canvas = document.getElementById("speedCanvas");
    const ctx = canvas.getContext("2d");
    
    function updatePlot() {
        const img = new Image();
        img.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // alten Plot löschen
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = "/plot.png?time=" + new Date().getTime(); // Cache umgehen
    }
    
    // alle 2 Sekunden aktualisieren
    setInterval(updatePlot, 100);
    
    // direkt beim Laden
    updatePlot();
    
    socket.on("update", data => {
        chart.data.datasets[0].data.push(data.gas);
        chart.update();
    });
</script>
